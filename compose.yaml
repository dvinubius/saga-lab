x-app-healthcheck: &app-healthcheck
  test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/readyz"]
  interval: 2s
  timeout: 2s
  retries: 30
  start_period: 60s
  start_interval: 250ms

services:
  postgres:
    image: postgres:17.10-alpine3.24@sha256:742f40ea20b9ff2ff31db5458d127452988a2164df9e17441e191f3b72252193
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "127.0.0.1:${POSTGRES_PORT-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./deploy/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD", "pg_isready", "-h", "127.0.0.1", "-U", "postgres"]
      interval: 2s
      timeout: 2s
      retries: 30
      start_period: 60s
      start_interval: 250ms

  rabbitmq:
    image: rabbitmq:4.3.5-management-alpine@sha256:b3b8b7f95f5382a19f9ea33540e604f30aad081d37ad9aba72255135765373a1
    hostname: rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: saga_lab
      RABBITMQ_DEFAULT_PASS: saga_lab
    ports:
      - "127.0.0.1:${RABBITMQ_PORT-5672}:5672"
      - "127.0.0.1:${RABBITMQ_MANAGEMENT_PORT-15672}:15672"
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
    healthcheck:
      # rabbitmq-diagnostics runs as root and can create a root-owned .erlang.cookie before the broker does, which then cannot start.
      test: ["CMD", "nc", "-z", "127.0.0.1", "5672"]
      interval: 2s
      timeout: 2s
      retries: 60
      start_period: 60s
      start_interval: 250ms

  otel-collector:
    image: otel/opentelemetry-collector:0.160.0@sha256:e495787f07dbe432ce763ebaf5bc3d113850e9eee2250ade7a3da6a882d0d69a
    command: ["--config=/etc/otel-collector/config.yaml"]
    ports:
      - "127.0.0.1:${OTEL_COLLECTOR_HTTP_PORT-4318}:4318"
    volumes:
      - ./deploy/otel-collector/config.yaml:/etc/otel-collector/config.yaml:ro
    depends_on:
      - tempo

  tempo:
    image: grafana/tempo:3.0.3@sha256:0296560ac66f8a3600d7fb3014a52c189d4d9c3549ad6ff441bf2409855d68d5
    command: ["-target=all", "-config.file=/etc/tempo/tempo.yaml"]
    ports:
      - "127.0.0.1:${TEMPO_PORT-3200}:3200"
    volumes:
      - ./deploy/tempo/tempo.yaml:/etc/tempo/tempo.yaml:ro
      - tempo-data:/var/tempo

  grafana:
    image: grafana/grafana:13.2.1@sha256:f772d434e8fab0049deb2b1b30abd43342bcfca1537614aa8d36080232cf4283
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Editor
      GF_AUTH_DISABLE_LOGIN_FORM: "true"
    ports:
      - "127.0.0.1:${GRAFANA_PORT-3000}:3000"
    volumes:
      - ./deploy/grafana/provisioning:/etc/grafana/provisioning:ro
    depends_on:
      - tempo

  bank-a:
    image: ${SAGA_LAB_SERVICES_IMAGE:-saga-lab-services}
    build: .
    entrypoint: ["/usr/local/bin/bank-a"]
    environment:
      DATABASE_URL: postgres://bank_a:bank_a@postgres:5432/bank_a?sslmode=disable
      AMQP_URL: amqp://saga_lab:saga_lab@rabbitmq:5672/
      OTEL_EXPORTER_OTLP_ENDPOINT: ${SAGA_LAB_OTLP_ENDPOINT-http://otel-collector:4318}
      OTEL_BSP_SCHEDULE_DELAY: "500"
    ports:
      - "127.0.0.1:${BANK_A_PORT-8081}:8080"
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    healthcheck: *app-healthcheck
    restart: unless-stopped

  bank-b:
    image: ${SAGA_LAB_SERVICES_IMAGE:-saga-lab-services}
    build: .
    entrypoint: ["/usr/local/bin/bank-b"]
    environment:
      DATABASE_URL: postgres://bank_b:bank_b@postgres:5432/bank_b?sslmode=disable
      AMQP_URL: amqp://saga_lab:saga_lab@rabbitmq:5672/
      OTEL_EXPORTER_OTLP_ENDPOINT: ${SAGA_LAB_OTLP_ENDPOINT-http://otel-collector:4318}
      OTEL_BSP_SCHEDULE_DELAY: "500"
    ports:
      - "127.0.0.1:${BANK_B_PORT-8082}:8080"
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    healthcheck: *app-healthcheck
    restart: unless-stopped

  transfer-service:
    image: ${SAGA_LAB_SERVICES_IMAGE:-saga-lab-services}
    build: .
    entrypoint: ["/usr/local/bin/transfer-service"]
    environment:
      DATABASE_URL: postgres://transfer_service:transfer_service@postgres:5432/transfer_service?sslmode=disable
      AMQP_URL: amqp://saga_lab:saga_lab@rabbitmq:5672/
      OTEL_EXPORTER_OTLP_ENDPOINT: ${SAGA_LAB_OTLP_ENDPOINT-http://otel-collector:4318}
      OTEL_BSP_SCHEDULE_DELAY: "500"
      # The test suite sets 2.5 seconds for productivity.
      BANK_B_RESUME_WAIT: ${SAGA_LAB_BANK_B_RESUME_WAIT-5s}
      BANK_A_URL: http://bank-a:8080
      BANK_B_URL: http://bank-b:8080
      GRAFANA_URL: ${SAGA_LAB_GRAFANA_URL-http://localhost:3000}
      VISITOR_COOKIE_SECURE: ${SAGA_LAB_VISITOR_COOKIE_SECURE-false}
    ports:
      - "127.0.0.1:${TRANSFER_SERVICE_PORT-8080}:8080"
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      bank-a:
        condition: service_healthy
      bank-b:
        condition: service_healthy
    healthcheck: *app-healthcheck
    restart: unless-stopped

volumes:
  postgres-data:
  rabbitmq-data:
  tempo-data:
